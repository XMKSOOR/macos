name: Build installers (Windows + macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            run: npm run dist -- --publish never
            artifact: DentalClinic-Setup-*.exe
          - os: macos-latest
            name: macos
            run: npm run dist -- --publish never
            artifact: DentalClinic-Mac-*-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env (from repository secrets)
        shell: bash
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://mroziduublsrcogojvcp.supabase.co' }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Build ${{ matrix.name }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: ${{ matrix.run }}

      - name: Upload ${{ matrix.name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
