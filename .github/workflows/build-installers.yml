name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win
          - name: macOS x64 (Catalina 10.15)
            os: macos-14
            args: --mac --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .env is gitignored; repackaged into resources/app.env by electron-builder
      # (extraResources). It is generated here from repository secrets so the
      # Supabase key never lands in the repository.
      - name: Generate .env (Supabase keys) from repository secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
        run: |
          : > .env
          [ -n "$SUPABASE_URL" ] && printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .env
          [ -n "$SUPABASE_SECRET_KEY" ] && printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY" >> .env
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> .env
          [ -n "$SUPABASE_JWKS_URL" ] && printf 'SUPABASE_JWKS_URL=%s\n' "$SUPABASE_JWKS_URL" >> .env
          if [ ! -s .env ]; then
            echo "::warning::لم تُضبط أسرار Supabase في الإعدادات (Settings>Secrets) — ستبنى النسخة بدون مفتاح وستكون المزامنة السحابية معطلة"
          fi

      - name: Compile app (electron-vite)
        run: npm run build

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

  # only runs when a v* tag is pushed, merges all artifacts into one Release
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' \) -exec cp {} release-files/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: false