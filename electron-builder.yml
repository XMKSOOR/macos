appId: com.clinic.desktop
productName: Dental Clinic
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: .env
    to: app.env
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: نظام إدارة عيادة الأسنان
  uninstallDisplayName: نظام إدارة عيادة الأسنان
  artifactName: DentalClinic-Setup-${version}.exe
mac:
  target:
    - target: dmg
      arch:
        - x64
  icon: build/icon.icns
  category: public.app-category.medical
  identity: null
  minimumSystemVersion: '10.15'
  artifactName: DentalClinic-Mac-${version}-${arch}.${ext}
dmg:
  title: Dental Clinic ${version}
  artifactName: DentalClinic-Mac-${version}-${arch}.${ext}